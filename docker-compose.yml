services:
  db:
    image: postgres:16-alpine
    container_name: doisoat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: doisoat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d doisoat"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: doisoat_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/doisoat
      JWT_SECRET: doi-chuoi-bat-ky-dai-va-kho-doan
      UPLOAD_DIR: /srv/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VLM_MODELS: ${GEMINI_VLM_MODELS:-gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-4-hydrogen}
      VLM_PROVIDER: ${VLM_PROVIDER:-auto}
      VLM_ENSEMBLE: ${VLM_ENSEMBLE:-false}
      QWEN_API_BASE: ${QWEN_API_BASE:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_VLM_MODEL: ${QWEN_VLM_MODEL:-qwen2.5-vl-72b-instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests:ro
      - ./qa:/srv/qa:ro
      - ./backend/uploads:/srv/uploads

volumes:
  pgdata:
